name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同時只跑一個發佈流程；不取消進行中的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # 測試失敗就停止，不會往下組裝或部署
      - run: node --test
      # 版本取 commit 完整雜湊的前 7 碼
      - run: node tools/pack.mjs --version "${GITHUB_SHA::7}" --out _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    # 只有 main 會部署；其他分支即使手動觸發也只跑 build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
